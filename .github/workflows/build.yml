- name: Package with AnyKernel3
        run: |
          # Clonar AnyKernel3 directamente
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Copiar la imagen del kernel compilada
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AK3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AK3/
          else
            cp out/arch/arm64/boot/Image AK3/
          fi
          
          # Copiar archivos dtb/dtbo si existen
          [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img AK3/ || true
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AK3/ || true
          
          # Entrar a la carpeta para empaquetar DESDE LA RAÍZ de AK3
          cd AK3
          zip -r9 ../Spes-Kernel-KSUNext.zip . -x ".git*" "README.md"
